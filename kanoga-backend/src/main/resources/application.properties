# ---------------------------------------------------------------------------
# Kanoga backend configuration
#
# No secrets in this file. Credentials are supplied by the environment:
#   - locally  : application-local.properties (git-ignored, see the .example file)
#   - on Railway: service Variables
#
# Startup fails loudly if a required value is missing, which is deliberate —
# a missing credential should not fall back to a hard-coded one.
# ---------------------------------------------------------------------------

spring.config.import=optional:file:./application-local.properties,optional:file:./kanoga-backend/application-local.properties

# --- Database (Supabase / PostgreSQL) --------------------------------------
# Port 6543 is Supabase's transaction-mode pooler. Session mode (5432) holds one
# database connection per application connection for its whole lifetime, which
# exhausted the free-tier connection limit during deployment testing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Transaction-mode pooling means many application connections share a small pool,
# so the pool itself is capped tightly.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# --- JPA -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Web -------------------------------------------------------------------
server.port=${PORT:8081}

# Comma-separated browser origins allowed to call this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- WooCommerce -----------------------------------------------------------
# Only the webhook secret is used: incoming order webhooks are authenticated by
# HMAC-SHA256 signature. The REST consumer key/secret were configured but never
# read by any code, so they have been removed rather than carried as dead config.
woocommerce.base-url=${WOO_BASE_URL:https://kanogapurpletea.com}
woocommerce.webhook.secret=${WOO_WEBHOOK_SECRET}

# --- Deployment identity and domain defaults --------------------------------
# These were previously hard-coded to one tea business. A different company
# configures the system here rather than editing source. Override in the
# environment with APP_BRANDING_COMPANYNAME, APP_DEFAULTS_SHELFLIFEMONTHS, etc.
app.branding.company-name=${APP_COMPANY_NAME:Kanoga}
app.branding.product-name=${APP_PRODUCT_NAME:Traceability System}
app.branding.code-prefix=${APP_CODE_PREFIX:KPG}

app.defaults.shelf-life-months=${APP_SHELF_LIFE_MONTHS:18}
app.defaults.batch-unit=${APP_BATCH_UNIT:kg}
app.defaults.product-unit=${APP_PRODUCT_UNIT:g}
app.defaults.expiry-alert-days=${APP_EXPIRY_ALERT_DAYS:30}
app.defaults.expiry-critical-days=${APP_EXPIRY_CRITICAL_DAYS:7}
app.defaults.low-stock-check-ms=${APP_LOW_STOCK_CHECK_MS:300000}

# Public URL of this backend. Used to build the webhook address shown on the
# Connections screen for pasting into a store's admin. Must be the externally
# reachable address in deployment, not localhost.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
